name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.96.0
      - run: cargo test --workspace
      - run: cargo test --features compat
      - run: cargo test --features array

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features compat -- -D warnings
      - run: cargo clippy --all-targets --features array -- -D warnings

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  no-std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
      - run: cargo build --no-default-features -p fitsio-pure
      - run: cargo build --target wasm32-unknown-unknown -p fitsio-pure

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - run: cargo build --features cli

  # Differential roundtrip tests cross-checking our compat shims against the
  # canonical cfitsio-backed `fitsio` crate. This is the only job that links the
  # C library; compat-parity is excluded from the main (C-free) workspace.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Install cfitsio
        run: sudo apt-get update && sudo apt-get install -y libcfitsio-dev
      - run: cargo test --manifest-path crates/compat-parity/Cargo.toml
